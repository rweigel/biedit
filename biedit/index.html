  <script>
    // Do not edit anything in this script block.
    let app = {};
    app['server'] = {
      initialFile: 'index.md',

      // If true, save, commit, and push will work.
      serverBacked: false,

      // (Not used) If true, .git directory found.
      repositoryBacked: false,
      // (Not used) If true, user has provided repository
      //  credentials in .git/config so that push will work.
      repositoryCredentials: false,

      // Don't save HTML
      noHTML: false,

      // Allow creation of file named index.md
      allowIndexMD: false
    }
  </script>

<body>

  <div id="wrapper">
    <div id="header"><a title="BiEdit code repository" href="https://gitlab.com/rweigel/biedit">BiEdit</a></div>
    <div id="content">
      <div id="left">
        <div id="left-header">
          <select id="file" title="Hold shift key before clicking drop-down to open in this in current tab">${files}</select>
            <span id="status"></span>
            <div id="md-toc-checkbox">
              <label id="markdownTOCLabel" title-unchecked="CTRL-m (⌘-m): Insert table of contents in editor with Markdown syntax." title-checked="Remove Markdown table of contents in editor and display.">
              <input type="checkbox" id="markdownTOC">
              Markdown TOC
             </label>
              <button id="markdownTOCUpdate" title="CTRL-m (⌘-m): Update Markdown table of contents in editor and display.">
                Update
              </button>            
            </div>
        </div>
        <div id="xconsole"></div>
        <div id="left-content">
          <div id="editor-toc"></div>
            <!-- 
              contenteditable=true so Grammarly works. Sometimes
              spellcheck="true" does not enable spell check on all
              browsers. See https://github.com/ajaxorg/ace/issues/2107
            -->
            <div id="editor" spellcheck="true" contenteditable="true"></div>
        </div>
        <div id="left-footer"></div>
      </div>
      <div id="drag"></div>
      <div id="right">
        <div id="right-header">
          <select id="view-options">
            <option value="html-rendered">Web Page</option>
            <option value="html-rendered-standalone">Web Page - New Tab</option>
            <option value="pdf-preview">PDF Preview</option>
            <option value="pdf">PDF</option>
            <option value="latex">LaTeX</option>
            <option value="latex-body">LaTeX - Body Only</option>
            <option value="html">HTML</option>
            <option value="html-body">HTML - Body Only</option>
            <option value="html-tagged">Editor HTML</option>
            <option value="html-tagged-body">Editor HTML - Body Only</option>
            <option value="html-tagged-body-raw">Editor HTML - Body Only; Raw</option>

          </select>
          <input
              id="zoom-right-input" 
              min="10"
              max="200"
              value="100"
              step="10"
              type="range"
            />
            <div id="linenumbers-checkbox-wrapper">
              <input type="checkbox" id="linenumbers-checkbox"/>
              <label for="linenumbers-checkbox" title="Show or hide line numbers.">
                Line #s
              </label>
            </div>
            <div id="solutions-checkbox-wrapper">
              <input type="checkbox" id="solutions-checkbox">
              <label for="solutions-checkbox" title="Show or hide solutions">Solutions</label>
            </div>
          <div id="pdf-status"></div>
          <div id="timing">0</div>
        </div>
        <div id="right-content">
          <div id="html-rendered">
            <div id="toc"></div>
            <div id="display"></div>
          </div>
          <div id="html-tagged-body-raw"></div>
          <div id="html-tagged-body"></div>
          <div id="html-tagged"></div>
          <div id="html"></div>
          <div id="html-body"></div>
          <div id="latex"></div>
          <div id="latex-body"></div>
          <div id="pdf-preview"></div>
          <div id="pdf"></div>
        </div>
        <div id="right-footer">
        </div>
      </div>
    </div>
    <div class="footer"></div>
  </div>
